name: HuuHungSAMP iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. CHECK REPOSITORY
      # ==========================================
      - name: Check repository
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "        HUUHUNG REPOSITORY CHECK"
          echo "========================================"

          echo ""
          echo "===== ROOT ====="
          pwd
          ls -la

          echo ""
          echo "===== NATIVE ====="
          find native -maxdepth 3 -type f -print || true

          test -d native
          test -d native/GameBridge
          test -d native/Protocol


      # ==========================================
      # 3. PREPARE RAKNET
      # ==========================================
      - name: Prepare RakNet
        run: |
          set -euxo pipefail

          if [ ! -d "third_party/RakNet-build" ]; then

            echo "RakNet not found."
            echo "Fetching open.mp RakNet..."

            mkdir -p third_party

            git clone \
              --depth 1 \
              https://github.com/openmultiplayer/RakNet.git \
              third_party/RakNet-build

          else

            echo "RakNet already exists."

          fi

          test -d third_party/RakNet-build

          echo ""
          echo "===== RAKNET ====="

          find third_party/RakNet-build \
            -maxdepth 2 \
            -type f \
            | head -100


      # ==========================================
      # 4. CHECK XCODE
      # ==========================================
      - name: Check Xcode
        run: |
          set -euxo pipefail

          echo "===== XCODE ====="
          xcodebuild -version

          echo ""
          echo "===== MACOS ====="
          sw_vers


      # ==========================================
      # 5. INSTALL XCODEGEN
      # ==========================================
      - name: Install XcodeGen
        run: |
          set -euxo pipefail

          brew update
          brew install xcodegen

          xcodegen version


      # ==========================================
      # 6. PREPARE IOS
      # ==========================================
      - name: Prepare iOS project
        run: |
          set -euxo pipefail

          rm -rf ios

          mkdir -p ios/Sources

          echo "===== IOS DIRECTORY ====="
          find ios -maxdepth 2 -print


      # ==========================================
      # 7. CREATE XCODE PROJECT CONFIG
      # NO ZIPFOUNDATION
      # ==========================================
      - name: Create project.yml
        run: |
          cat > ios/project.yml <<'EOF'
          name: HuuHungSAMP

          options:
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true

          targets:

            HuuHungSAMP:
              type: application
              platform: iOS

              sources:

                - path: Sources

                - path: ../native/Protocol

                - path: ../native/GameBridge

              settings:
                base:

                  PRODUCT_BUNDLE_IDENTIFIER: com.huuhung.samp

                  PRODUCT_NAME: HuuHungSAMP

                  SWIFT_VERSION: "5.0"

                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

                  TARGETED_DEVICE_FAMILY: "1,2"

                  SUPPORTS_MACCATALYST: NO

                  CLANG_CXX_LANGUAGE_STANDARD: "c++17"

                  CLANG_CXX_LIBRARY: "libc++"

                  GCC_C_LANGUAGE_STANDARD: "gnu11"

                  HEADER_SEARCH_PATHS:

                    - "$(SRCROOT)/../native"

                    - "$(SRCROOT)/../native/GameBridge"

                    - "$(SRCROOT)/../native/Protocol"

                    - "$(SRCROOT)/../third_party/RakNet-build/Source"

                  USER_HEADER_SEARCH_PATHS:

                    - "$(SRCROOT)/../native"

                    - "$(SRCROOT)/../native/GameBridge"

                    - "$(SRCROOT)/../native/Protocol"

                    - "$(SRCROOT)/../third_party/RakNet-build/Source"

                  OTHER_CPLUSPLUSFLAGS:

                    - "-std=c++17"

                  ENABLE_BITCODE: NO

                  CODE_SIGNING_ALLOWED: NO

                  CODE_SIGNING_REQUIRED: NO

              info:

                path: Info.plist

                properties:

                  CFBundleDisplayName: HuuHungSAMP

                  CFBundleIdentifier: com.huuhung.samp

                  CFBundleName: HuuHungSAMP

                  CFBundlePackageType: APPL

                  CFBundleShortVersionString: "1.0"

                  CFBundleVersion: "1"

                  LSRequiresIPhoneOS: true

                  UILaunchScreen:
                    {}

                  UISupportedInterfaceOrientations:

                    - UIInterfaceOrientationLandscapeLeft

                    - UIInterfaceOrientationLandscapeRight

          EOF

          echo "===== project.yml ====="
          cat ios/project.yml


      # ==========================================
      # 8. INFO.PLIST
      # ==========================================
      - name: Create Info.plist
        run: |
          cat > ios/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>HuuHungSAMP</string>

              <key>CFBundleIdentifier</key>
              <string>com.huuhung.samp</string>

              <key>CFBundleName</key>
              <string>HuuHungSAMP</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict/>

              <key>UISupportedInterfaceOrientations</key>

              <array>

                  <string>
                  UIInterfaceOrientationLandscapeLeft
                  </string>

                  <string>
                  UIInterfaceOrientationLandscapeRight
                  </string>

              </array>

          </dict>

          </plist>
          EOF

          echo "===== Info.plist ====="
          cat ios/Info.plist


      # ==========================================
      # 9. APPDELEGATE
      # ==========================================
      - name: Create AppDelegate.swift
        run: |
          cat > ios/Sources/AppDelegate.swift <<'EOF'
          import UIKit
          import Foundation

          final class AppDelegate:
              UIResponder,
              UIApplicationDelegate {

              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions
                  launchOptions:
                  [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {

                  let window =
                      UIWindow(
                          frame:
                          UIScreen.main.bounds
                      )

                  let controller =
                      LauncherViewController()

                  window.rootViewController =
                      controller

                  window.makeKeyAndVisible()

                  self.window =
                      window

                  print(
                      "[HUUHUNG] Application launched"
                  )

                  return true
              }
          }


          final class LauncherViewController:
              UIViewController {

              private let titleLabel =
                  UILabel()

              private let statusLabel =
                  UILabel()

              private let downloadButton =
                  UIButton(type: .system)

              private let updateButton =
                  UIButton(type: .system)

              private let playButton =
                  UIButton(type: .system)


              override func viewDidLoad() {

                  super.viewDidLoad()

                  setupUI()
              }


              private func setupUI() {

                  view.backgroundColor =
                      .black


                  titleLabel.text =
                      "HUU HUNG SAMP"

                  titleLabel.textColor =
                      .white

                  titleLabel.font =
                      UIFont.boldSystemFont(
                          ofSize: 36
                      )

                  titleLabel.textAlignment =
                      .center


                  statusLabel.text =
                      "GTA SA 2.2.21"

                  statusLabel.textColor =
                      .lightGray

                  statusLabel.font =
                      UIFont.systemFont(
                          ofSize: 18
                      )

                  statusLabel.textAlignment =
                      .center


                  configureButton(
                      downloadButton,
                      title: "DOWNLOAD DATA"
                  )


                  configureButton(
                      updateButton,
                      title: "UPDATE DATA"
                  )


                  configureButton(
                      playButton,
                      title: "PLAY"
                  )


                  downloadButton.addTarget(
                      self,
                      action:
                          #selector(
                              downloadPressed
                          ),
                      for:
                          .touchUpInside
                  )


                  updateButton.addTarget(
                      self,
                      action:
                          #selector(
                              updatePressed
                          ),
                      for:
                          .touchUpInside
                  )


                  playButton.addTarget(
                      self,
                      action:
                          #selector(
                              playPressed
                          ),
                      for:
                          .touchUpInside
                  )


                  let stack =
                      UIStackView(
                          arrangedSubviews: [

                              titleLabel,

                              statusLabel,

                              downloadButton,

                              updateButton,

                              playButton

                          ]
                      )


                  stack.axis =
                      .vertical

                  stack.spacing =
                      20

                  stack.translatesAutoresizingMaskIntoConstraints =
                      false


                  view.addSubview(stack)


                  NSLayoutConstraint.activate([

                      stack.leadingAnchor.constraint(
                          equalTo:
                              view.leadingAnchor,
                          constant: 80
                      ),

                      stack.trailingAnchor.constraint(
                          equalTo:
                              view.trailingAnchor,
                          constant: -80
                      ),

                      stack.centerYAnchor.constraint(
                          equalTo:
                              view.centerYAnchor
                      ),

                      downloadButton.heightAnchor.constraint(
                          equalToConstant: 60
                      ),

                      updateButton.heightAnchor.constraint(
                          equalToConstant: 60
                      ),

                      playButton.heightAnchor.constraint(
                          equalToConstant: 60
                      )

                  ])
              }


              private func configureButton(
                  _ button: UIButton,
                  title: String
              ) {

                  button.setTitle(
                      title,
                      for: .normal
                  )

                  button.setTitleColor(
                      .white,
                      for: .normal
                  )

                  button.backgroundColor =
                      .darkGray

                  button.layer.cornerRadius =
                      12

                  button.titleLabel?.font =
                      UIFont.boldSystemFont(
                          ofSize: 18
                      )
              }


              @objc
              private func downloadPressed() {

                  statusLabel.text =
                      "DATA DOWNLOAD"

                  print(
                      "[HUUHUNG] DOWNLOAD DATA"
                  )
              }


              @objc
              private func updatePressed() {

                  statusLabel.text =
                      "DATA UPDATE"

                  print(
                      "[HUUHUNG] UPDATE DATA"
                  )
              }


              @objc
              private func playPressed() {

                  statusLabel.text =
                      "SA-MP CLIENT"

                  print(
                      "[HUUHUNG] PLAY"
                  )
              }

          }
          EOF


      # ==========================================
      # 10. MAIN.SWIFT
      # FIX _main
      # ==========================================
      - name: Create main.swift
        run: |
          cat > ios/Sources/main.swift <<'EOF'
          import UIKit

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )
          EOF


      # ==========================================
      # 11. CHECK NO UNWANTED DEPENDENCIES
      # ==========================================
      - name: Check dependencies
        run: |
          set -euxo pipefail

          echo "===== CHECK ZIPFOUNDATION ====="

          if grep -Rni \
            "ZIPFoundation" \
            ios \
            2>/dev/null; then

              echo "ERROR: ZIPFoundation still exists."

              exit 1

          else

              echo "OK: ZIPFoundation removed."

          fi


          echo ""
          echo "===== CHECK UIUTILITIES ====="

          if grep -Rni \
            "UIUtilities" \
            ios \
            2>/dev/null; then

              echo "ERROR: UIUtilities reference found."

              exit 1

          else

              echo "OK: UIUtilities not referenced."

          fi


      # ==========================================
      # 12. GENERATE XCODE PROJECT
      # ==========================================
      - name: Generate Xcode project
        run: |
          set -euxo pipefail

          cd ios

          xcodegen generate

          echo ""
          echo "===== GENERATED IOS PROJECT ====="

          find . \
            -maxdepth 3 \
            -type f \
            -print


          test -f \
            HuuHungSAMP.xcodeproj/project.pbxproj


          echo ""
          echo "===== PROJECT SOURCES ====="

          grep -n \
            -E \
            "AppDelegate|main.swift|SampProtocol|GTAIOSRuntime|ImageSlide" \
            HuuHungSAMP.xcodeproj/project.pbxproj \
            || true


      # ==========================================
      # 13. CLEAN
      # ==========================================
      - name: Clean build
        run: |
          set -euxo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/build"

          rm -rf \
            "$HOME/Library/Developer/Xcode/DerivedData/"*


      # ==========================================
      # 14. BUILD IOS SIMULATOR
      # ==========================================
      - name: Build iOS Simulator
        run: |

          set +e

          echo ""
          echo "========================================"
          echo "       HUUHUNG IOS BUILD START"
          echo "========================================"

          xcodebuild \
            -project \
              "$GITHUB_WORKSPACE/ios/HuuHungSAMP.xcodeproj" \
            -scheme \
              HuuHungSAMP \
            -sdk \
              iphonesimulator \
            -configuration \
              Release \
            -destination \
              'generic/platform=iOS Simulator' \
            -derivedDataPath \
              "$GITHUB_WORKSPACE/build" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CLANG_CXX_LANGUAGE_STANDARD=c++17 \
            CLANG_CXX_LIBRARY=libc++ \
            build \
            2>&1 |
            tee \
              "$GITHUB_WORKSPACE/build.log"


          BUILD_EXIT=${PIPESTATUS[0]}


          echo ""
          echo "========================================"
          echo "       HUUHUNG BUILD DIAGNOSTICS"
          echo "========================================"


          grep -n \
            -B20 \
            -A40 \
            -E \
            "Undefined symbols|duplicate symbol|symbol\(s\) not found|framework not found|library not found|fatal error:|error:|ld:|clang: error|BUILD FAILED" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -500 \
            || true


          echo ""
          echo "========================================"
          echo "             BUILD RESULT"
          echo "========================================"


          if [ "$BUILD_EXIT" -eq 0 ]; then

              echo "BUILD SUCCESS"

          else

              echo "BUILD FAILED"

          fi


          exit "$BUILD_EXIT"


      # ==========================================
      # 15. VERIFY APP
      # ==========================================
      - name: Verify app
        if: success()
        run: |

          set -euxo pipefail

          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphonesimulator/HuuHungSAMP.app"


          echo "========================================"
          echo "             APP VERIFY"
          echo "========================================"


          test -d "$APP"


          echo ""
          echo "===== APP ====="

          ls -lah "$APP"


          echo ""
          echo "===== EXECUTABLE ====="

          file \
            "$APP/HuuHungSAMP"


          echo ""
          echo "===== ARCHITECTURE ====="

          lipo \
            -info \
            "$APP/HuuHungSAMP"


          echo ""
          echo "===== APP VERIFIED ====="


      # ==========================================
      # 16. UPLOAD APP
      # ==========================================
      - name: Upload Simulator App
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: HuuHungSAMP-iOS-Simulator

          path: |
            build/Build/Products/Release-iphonesimulator/HuuHungSAMP.app