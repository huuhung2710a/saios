name: HuuHungSAMP iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository
        run: |
          set -euxo pipefail

          echo "===== ROOT ====="
          ls -la

          echo "===== NATIVE ====="
          find native -type f -maxdepth 3 -print

          test -d native
          test -d native/GameBridge
          test -d native/Protocol

      - name: Prepare RakNet
        run: |
          set -euxo pipefail

          if [ ! -d "third_party/RakNet-build" ]; then
            echo "RakNet is not committed; fetching open.mp RakNet..."
            git clone --depth 1 \
              https://github.com/openmultiplayer/RakNet.git \
              third_party/RakNet-build
          fi

          test -d third_party/RakNet-build

          echo "===== RAKNET ====="
          find third_party/RakNet-build \
            -maxdepth 2 \
            -type f \
            | head -100

      - name: Check Xcode
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen version

      - name: Create iOS project
        run: |
          set -euxo pipefail

          rm -rf ios
          mkdir -p ios/Sources

          cat > ios/project.yml <<'EOF'
          name: HuuHungSAMP

          options:
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true

          packages:
            ZIPFoundation:
              url: https://github.com/weichsel/ZIPFoundation.git
              exactVersion: 0.9.20

          targets:

            HuuHungSAMP:
              type: application
              platform: iOS

              sources:
                - path: Sources
                - path: ../native/Protocol
                - path: ../native/GameBridge

              dependencies:
                - package: ZIPFoundation

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.huuhung.samp
                  PRODUCT_NAME: HuuHungSAMP

                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

                  TARGETED_DEVICE_FAMILY: "1,2"
                  SUPPORTS_MACCATALYST: NO

                  CLANG_CXX_LANGUAGE_STANDARD: "c++17"
                  CLANG_CXX_LIBRARY: "libc++"

                  GCC_C_LANGUAGE_STANDARD: "gnu11"

                  HEADER_SEARCH_PATHS:
                    - "$(SRCROOT)/../native"
                    - "$(SRCROOT)/../native/GameBridge"
                    - "$(SRCROOT)/../native/Protocol"
                    - "$(SRCROOT)/../third_party/RakNet-build/Source"

                  USER_HEADER_SEARCH_PATHS:
                    - "$(SRCROOT)/../native"
                    - "$(SRCROOT)/../third_party/RakNet-build/Source"

                  OTHER_CPLUSPLUSFLAGS:
                    - "-std=c++17"

                  ENABLE_BITCODE: NO

                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO

                  SWIFT_OBJC_BRIDGING_HEADER: ""

              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: HuuHungSAMP
                  CFBundleIdentifier: com.huuhung.samp
                  CFBundleName: HuuHungSAMP
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  LSRequiresIPhoneOS: true

                  UILaunchScreen:
                    {}

                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
          EOF

      - name: Create Info.plist
        run: |
          cat > ios/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>CFBundleDisplayName</key>
              <string>HuuHungSAMP</string>

              <key>CFBundleIdentifier</key>
              <string>com.huuhung.samp</string>

              <key>CFBundleName</key>
              <string>HuuHungSAMP</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

          </dict>
          </plist>
          EOF

      - name: Create AppDelegate
        run: |
          cat > ios/Sources/AppDelegate.swift <<'EOF'
          import UIKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions
                  launchOptions:
                  [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {

                  let window = UIWindow(
                      frame: UIScreen.main.bounds
                  )

                  let controller = UIViewController()

                  controller.view.backgroundColor = .black

                  let label = UILabel()

                  label.text = """
                  HUU HUNG SAMP

                  iOS Client

                  Native layer loaded
                  GTA SA 2.2.21 target
                  """

                  label.textColor = .white
                  label.textAlignment = .center
                  label.numberOfLines = 0
                  label.font = .boldSystemFont(ofSize: 24)

                  label.translatesAutoresizingMaskIntoConstraints = false

                  controller.view.addSubview(label)

                  NSLayoutConstraint.activate([
                      label.centerXAnchor.constraint(
                          equalTo: controller.view.centerXAnchor
                      ),
                      label.centerYAnchor.constraint(
                          equalTo: controller.view.centerYAnchor
                      )
                  ])

                  window.rootViewController = controller
                  window.makeKeyAndVisible()

                  self.window = window

                  return true
              }
          }
          EOF

      - name: Generate Xcode project
        run: |
          set -euxo pipefail

          cd ios

          xcodegen generate

          test -f HuuHungSAMP.xcodeproj/project.pbxproj

          echo "===== SOURCES IN PROJECT ====="

          grep -n \
            -E "SampProtocol|GTAIOSRuntime|ImageSlide|AppDelegate" \
            HuuHungSAMP.xcodeproj/project.pbxproj \
            || true

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/HuuHungSAMP.xcodeproj \
            -scheme HuuHungSAMP

      - name: Clean
        run: |
          rm -rf build
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Build iOS Simulator
        run: |
          set +e

          xcodebuild \
            -project "$GITHUB_WORKSPACE/ios/HuuHungSAMP.xcodeproj" \
            -scheme HuuHungSAMP \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CLANG_CXX_LANGUAGE_STANDARD=c++17 \
            CLANG_CXX_LIBRARY=libc++ \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "           BUILD DIAGNOSTICS"
          echo "========================================"

          grep -n -B15 -A35 \
            -E \
            "Undefined symbols|duplicate symbol|symbol\(s\) not found|framework not found|library not found|fatal error:|error:|ld:|clang: error|BUILD FAILED" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -400 || true

          echo ""
          echo "========================================"
          echo "           BUILD RESULT"
          echo "========================================"

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "BUILD SUCCESS"
          else
            echo "BUILD FAILED"
          fi

          exit "$BUILD_EXIT"

      - name: Verify app
        if: success()
        run: |
          set -euxo pipefail

          APP="build/Build/Products/Release-iphonesimulator/HuuHungSAMP.app"

          test -d "$APP"

          echo "===== APP ====="
          ls -lah "$APP"

          echo "===== MACH-O ====="
          file "$APP/HuuHungSAMP"

      - name: Upload Simulator App
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HuuHungSAMP-iOS-Simulator
          path: build/Build/Products/Release-iphonesimulator/HuuHungSAMP.app            build/Build/Products/Release-iphonesimulator/HuuHungSAMP.app
